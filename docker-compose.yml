services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safezone-postgis
    environment:
      POSTGRES_DB: safezone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - safezone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safezone_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  safezone_pgdata:
